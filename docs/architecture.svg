<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Audience Sim system design</title><desc id="desc">Frozen inputs and a scoped persona feed separate whole-article inspection and bounded-session paths. Evidence validation and trace audit precede a bounded recommendation and real-reader measurement.</desc><rect width="1400" height="520" rx="20" fill="#142c21"/><text x="30" y="53" fill="#d8efb8" font-family="sans-serif" font-size="30" font-weight="bold">Audience Sim · keep the evidence attached</text><g fill="none" stroke="#9cc27c" stroke-width="3"><path d="M370 160H430M370 330H430M880 160H940M880 330H940"/></g><rect x="30" y="100" width="340" height="120" rx="12" fill="#f4f6ec"/><text x="50" y="145" font-family="sans-serif" font-size="25" font-weight="bold" fill="#1c3628">Freeze inputs</text><text x="50" y="183" font-family="sans-serif" font-size="18" fill="#35573e">Article bytes · media · version</text><rect x="30" y="270" width="340" height="120" rx="12" fill="#f4f6ec"/><text x="50" y="315" font-family="sans-serif" font-size="25" font-weight="bold" fill="#1c3628">Scope the persona</text><text x="50" y="353" font-family="sans-serif" font-size="18" fill="#35573e">Approved fields + selected post</text><rect x="430" y="100" width="450" height="120" rx="12" fill="#f4f6ec"/><text x="450" y="145" font-family="sans-serif" font-size="25" font-weight="bold" fill="#1c3628">Inspect the whole article</text><text x="450" y="183" font-family="sans-serif" font-size="18" fill="#35573e">Declared media access · reviewed claims</text><rect x="430" y="270" width="450" height="120" rx="12" fill="#f4f6ec"/><text x="450" y="315" font-family="sans-serif" font-size="25" font-weight="bold" fill="#1c3628">Run a bounded session</text><text x="450" y="353" font-family="sans-serif" font-size="18" fill="#35573e">Visible evidence · allowed actions · clocks</text><rect x="940" y="100" width="430" height="120" rx="12" fill="#f4f6ec"/><text x="960" y="145" font-family="sans-serif" font-size="25" font-weight="bold" fill="#1c3628">Validate the evidence</text><text x="960" y="183" font-family="sans-serif" font-size="18" fill="#35573e">IDs · exact fragments · source intervals</text><rect x="940" y="270" width="430" height="120" rx="12" fill="#f4f6ec"/><text x="960" y="315" font-family="sans-serif" font-size="25" font-weight="bold" fill="#1c3628">Audit the trace</text><text x="960" y="353" font-family="sans-serif" font-size="18" fill="#35573e">Fresh context · censoring · failures</text><text x="30" y="451" font-family="sans-serif" font-size="24" fill="#d8efb8">Bounded editorial recommendation → next real-reader measurement</text><text x="30" y="487" font-family="sans-serif" font-size="18" fill="#c2d4ba">Authored personas · elicited ranges · unknown coverage · no measured reader outcomes</text></svg>
